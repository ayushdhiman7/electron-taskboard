name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS)
        run: npm run make -- --targets @felixrieseberg/electron-forge-maker-nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-exe
          path: out/make/**/*.exe
